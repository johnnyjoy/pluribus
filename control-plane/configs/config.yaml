# Compose/runtime config (postgres + redis service names). Mounted into the container
# by docker-compose.yml — edits here apply on restart (no image rebuild).
# Host-local dev without Docker: copy config.example.yaml → config.local.yaml and
# set CONFIG=configs/config.local.yaml. The image does NOT bake this file; it ships
# config.example.yaml as a template only.

server:
  bind: ":8123"

# MCP: POST /v1/mcp (default on). Uncomment to disable:
# mcp:
#   disabled: true

# Optional backend synthesis for run-multi. Default off — see docs/backend-synthesis.md
synthesis:
  enabled: false

startup:
  db_wait_timeout_seconds: 60
  db_wait_interval_millis: 1000

postgres:
  dsn: "postgres://controlplane:controlplane@postgres:5432/controlplane?sslmode=disable"

redis:
  enabled: true
  addr: "redis:6379"
  password: ""
  db: 0
  default_ttl_seconds: 300

evidence:
  root_path: "/tmp/evidence"
  authority_factor: 0.1

recall:
  default_max_items_per_kind: 5
  default_max_total: 0
  default_max_tokens: 0
  cache_ttl_seconds: 300
  ranking:
    weight_authority: 1.0
    weight_recency: 0.5
    weight_scope_match: 1.0
    weight_tag_match: 1.0
    weight_failure_overlap: 0.5
    weight_symbol_overlap: 0.5
    weight_pattern_priority: 0.0
    weight_lexical_similarity: 0.15
    weight_cross_context_salience: 0.12
    weight_cross_agent_salience: 0.12
    weight_semantic_similarity: 0.4
    weight_situational_affinity: 0.35
  # Local Ollama-compatible embedder (ollama pull nomic-embed-text; ollama serve).
  # Embedder down/misconfigured → graceful lexical fallback ([SEMANTIC FALLBACK] logs).
  # Column dimension must match: see migrations/0015_local_embedder_dimensions.sql (768).
  # This file is the Docker/Compose default: host.docker.internal reaches Ollama on
  # the docker host (compose adds the host-gateway mapping). For bare-metal runs use
  # config.local.yaml with http://127.0.0.1:11434/v1.
  semantic_retrieval:
    enabled: true
    embedding_endpoint: "http://host.docker.internal:11434/v1"
    embedding_model: "nomic-embed-text"
    embedding_dimensions: 768
    max_semantic_candidates: 50
    min_cosine_similarity: 0.35
    log_semantic_matches: false
  # evidence_in_bundle:
  #   enabled: false
  #   max_per_memory: 2
  #   max_per_bundle: 12
  #   summary_max_chars: 256

memory:
  # Phase 1 hive ingest: active at capped authority; utility/ranking curate after use (not pending warehouse).
  formation:
    hive_defaults: true
    direct_create:
      enabled: true
      reject_junk: true
      max_client_authority: 4
      governing_default_status: active
      require_admin_for_governing: false
      require_provenance_for_governing: false
      allow_active_high_risk_governing: true
      allow_active_with_quality_warnings: true
      allow_active_despite_quality_review: true
      allow_active_promoted_governing: true
    record_experience:
      reject_junk: true
      risky_constraint_pending: false
  lifecycle:
    authority_positive_delta: 0.1
    authority_negative_delta: 0.2
    expiration_authority_threshold: 2
    # C3/auto-curation: probationary rows without TTL decay out after 30 idle days
    # (authority below threshold, no historical-value signals).
    probationary_expire_days: 30
  # Corroboration (Phase 3): authority rises only when a NEW distinct agent uses
  # the memory; authors and repeat users merge salience without self-promoting.
  # Impact deltas restated because a partial block overrides built-in defaults.
  recall_reinforcement:
    require_distinct_agent_for_authority: true
    impact_high_delta: 2
    impact_medium_delta: 1
    impact_low_delta: 0
    min_signal_strength_for_low: 1
  # Exact canonical dedup on POST /v1/memory (Phase C). Omit or enabled: true = reject duplicates with 409.
  dedup:
    enabled: true
    # Phase F: recall bundle near-dup collapse (Jaccard on canonical); 0 = near-dup off (exact key collapse still on when ranking).
    near_dup_jaccard_threshold: 0.92
    # P2.9: reinforce semantically near-duplicates at create instead of inserting (requires semantic retrieval).
    semantic_consolidate_threshold: 0.93

# Phase 3 auto-curation: background loop that expires stale/probationary rows and
# auto-promotes eligible candidates (only when promotion.auto_promote is enabled).
# Also opens agent-driven curation chores (contradiction review, quarantine review,
# embedding near-duplicate pairs) that visiting agents resolve via corroborated votes.
curation_scheduler:
  enabled: true
  interval_minutes: 60
  initial_delay_seconds: 30
  # Embedding near-duplicate pair scan → duplicate_pair chores.
  neardup_scan_enabled: true
  neardup_cosine_threshold: 0.92
  neardup_scan_window_days: 14
  neardup_scan_limit: 20
  # Distinct agents that must vote the same action before a chore applies.
  # 2 = corroborated (recommended once several agents visit); 1 = single-agent hive.
  chore_min_resolvers: 2
  # Bounded embedding backfill each pass (rows missing/stale vectors).
  embed_backfill_enabled: true
  embed_backfill_batch_size: 50
  # Prune rejected advisory episodes older than 30 days each pass.
  prune_rejected_enabled: true
  prune_rejected_older_than_hours: 720
  prune_rejected_limit: 1000

slow_path:
  enabled: false
  high_risk_threshold: 1.0
  expand_constraints_by: 4
  expand_failures_by: 4
  expand_patterns_by: 2
  require_second_drift_check: true
  extra_variants_when_slow: 0

drift:
  failure_fuzzy_threshold: 0
  pattern_high_blocks: true

lsp:
  enabled: false
  recall_symbol_boost: 0.5
  reference_expansion_limit: 0
  high_risk_reference_threshold: 0
  auto_symbol_max: 64

promotion:
  require_evidence: false
  min_evidence_links: 0
  min_evidence_score: 0
  require_review: false   # true => promoted rows status pending; see config.example.yaml
  min_promote_confidence: 0
  # min_policy_composite / weight_* / signal_norm_divisor — see config.example.yaml

curation:
  candidate_threshold: 0.5
  review_threshold: 0.7
  promote_threshold: 0.85
  digest_max_proposals: 5
  digest_work_summary_max_bytes: 8192
  digest_statement_max_bytes: 2048
  digest_reason_max_bytes: 1024

# Pre-change enforcement (RC1 default on when section omitted).
enforcement:
  min_binding_authority: 3   # hive agents write low authority; binding still applies at recall/enforcement

# To disable enforcement:
# enforcement:
#   enabled: false
#   min_binding_authority: 7
#   max_binding_memories: 120
#   include_global_binding: true

# Advisory episodes (lexical/tag resemblance; not canonical memory). Default on when omitted; set enabled: false to turn off ingest.
similarity:
  enabled: true
  max_summary_bytes: 2048
  max_episodes_scan: 500
  max_results: 5
  min_resemblance: 0.08
