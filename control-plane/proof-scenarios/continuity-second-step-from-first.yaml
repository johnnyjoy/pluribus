id: continuity-second-step-from-first
version: 1
title: Second-step recall benefits from first-step materialized learning
mode: integration
category: continuity
benefit_claim: >-
  Continuity: a second retrieval step in the same project still sees memory created
  in an earlier step — learning persists across steps within one proof flow.
tags:
  - continuity
seed:
  description: Single project; digest/materialize then two recall compiles.
stimulus:
  type: two_step_recall
expected:
  both_steps_see_decision: true
does_not_prove:
  - Cross-agent or cross-process continuity (single HTTP client, sequential compiles)
  - Ranking persistence if unrelated memories outscore the materialized decision
  - MCP multi-step agent workflow fidelity
  - Success when materialize consolidates without situation tag retrieval of this run's marker (hostile verify fails that)
